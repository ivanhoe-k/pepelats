[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pepelats"
version = "0.1.0"
description = "Opinionated async web-service engine"
requires-python = ">=3.13"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
  "dishka>=1.6.0",
  "dynaconf>=3.2.0",
  "pydantic",
  "starlette",
  "structlog",
  "uvicorn>=0.32.0",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
  "opentelemetry-instrumentation-asgi",
  "opentelemetry-instrumentation-logging",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115.0"]

[dependency-groups]
dev = [
  "black",
  "mypy",
  "ruff",
  "pytest",
  "pytest-asyncio",
  "pytest-benchmark",
  "httpx",
  "fastapi>=0.115.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pepelats"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not perf'"
markers = [
  "smoke: minimal boots-and-serves subset of the integration suite",
  "perf: performance benchmarks (manual, excluded from the default run)",
]

[tool.black]
line-length = 88
target-version = ["py313"]
exclude = "(\\.venv|build|dist)"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_decorators = false
warn_unused_configs = true
mypy_path = ["src", "tests"]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["dynaconf.*"]
ignore_missing_imports = true
