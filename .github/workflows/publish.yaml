# Publish when a GitHub Release is created.
# Alpha/pre-release: tag from dev (e.g. v0.1.0a1).
# Stable: merge dev → main, then tag from main (e.g. v0.1.0).
# PyPI trusted publishing: environment "pypi", workflow publish.yaml.

name: Upload Python Package to PyPI when a new Release is Created

on:
  release:
    types: [created]

env:
  UV_PYTHON_DOWNLOADS: 0

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Publish
        run: uv publish
